[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpr-hybrid"
version = "0.1.0"
description = "Egocentric CPR video -> hybrid CV pipeline for compression-rate estimation"
requires-python = ">=3.10,<3.11"
readme = "README.md"
dependencies = [
    "numpy",
    "opencv-python",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
