name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU-only torch (avoids pulling multi-GB CUDA wheels in CI)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test + coverage (pytest, excluding slow/model-download tests)
        run: pytest -m "not slow" --cov=src/hybrid --cov-report=term-missing
