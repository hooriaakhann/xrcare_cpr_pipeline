# Default pipeline config. Every field here maps to a Pydantic model in
# src/hybrid/config.py — an unknown key or wrong type fails validation at
# load time rather than silently being ignored.
#
# Paths are relative to the project root; load_config() resolves them to
# absolute paths.

project:
  seed: 42

paths:
  data_root: data
  raw_dir: data/raw
  processed_dir: data/processed
  split_dir: data/split
  metadata_dir: data/metadata
  ground_truth_csv: data/metadata/ground_truth_summary.csv
  cache_dir: data/cache
  runs_dir: runs
  models_dir: models

video:
  development_glob: "data/split/*_development.mp4"
  test_glob: "data/split/*_test.mp4"

logging:
  level: INFO
  log_dir: runs/logs

caching:
  enabled: true

mediapipe:
  min_hand_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  max_num_hands: 1
  roi_padding_ratio: 0.5
  forearm_extension_ratio: 1.2
  max_detection_gap_sec: 1.0
