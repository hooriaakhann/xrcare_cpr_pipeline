# Default pipeline config. Every field here maps to a Pydantic model in
# src/hybrid/config.py — an unknown key or wrong type fails validation at
# load time rather than silently being ignored.
#
# Paths are relative to the project root; load_config() resolves them to
# absolute paths.

project:
  seed: 42

paths:
  data_root: data
  raw_dir: data/raw
  processed_dir: data/processed
  split_dir: data/split
  metadata_dir: data/metadata
  ground_truth_csv: data/metadata/ground_truth_summary.csv
  cache_dir: data/cache
  runs_dir: runs
  models_dir: models

video:
  development_glob: "data/split/*_development.mp4"
  test_glob: "data/split/*_test.mp4"

logging:
  level: INFO
  log_dir: runs/logs

caching:
  enabled: true

mediapipe:
  min_hand_detection_confidence: 0.5
  min_hand_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  max_num_hands: 1
  roi_padding_ratio: 0.5
  forearm_extension_ratio: 1.2
  max_detection_gap_sec: 1.0

cotracker:
  num_points: 40
  visibility_threshold: 0.6
  reinit_visibility_threshold: 0.4
  max_reinits: 10
  max_track_loss_sec: 2.0
  window_frames: 100
  working_max_dim: 1024

ego_motion:
  max_features: 200
  quality_level: 0.01
  min_distance: 8.0
  roi_exclusion_dilate_px: 20
  ransac_reproj_threshold: 3.0
  min_inlier_ratio: 0.5
  max_rotation_deg: 15.0
  min_scale: 0.8
  max_scale: 1.25
  max_unreliable_span_sec: 2.0

optical_flow:
  pyr_scale: 0.5
  levels: 3
  winsize: 15
  iterations: 3
  poly_n: 5
  poly_sigma: 1.2
  motion_percentile: 75.0
  max_flow_magnitude: 50.0
  max_unstable_span_sec: 2.0

filtering:
  butterworth_low_hz: 1.0
  butterworth_high_hz: 3.0
  butterworth_order: 4
